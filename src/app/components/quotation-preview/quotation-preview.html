<div class="dialog-wrapper" *ngIf="isDialogMode">
  <div class="dialog-header">
    <div class="dialog-header-title">
      <span class="preview-doc-icon">📄</span>
      <h3>Quotation Preview</h3>
    </div>
    <button type="button" class="dialog-close-btn" (click)="closeDialog()">&times;</button>
  </div>
  
  <div class="dialog-body">
    <div class="pdf-preview-container" *ngIf="pdfSafeUrl">
      <iframe [src]="pdfSafeUrl" class="pdf-iframe" title="PDF Quotation Preview"></iframe>
    </div>
    <div class="pdf-loading" *ngIf="!pdfSafeUrl">
      <div class="spinner"></div>
      <p>Generating PDF Preview...</p>
    </div>
  </div>

  <div class="dialog-footer">
    <button type="button" class="btn-dialog-close" (click)="closeDialog()">Close</button>
    <button type="button" class="btn-dialog-download" (click)="downloadPdf()">
      <span class="btn-icon">📄</span> Download PDF
    </button>
  </div>
</div>

<!-- Inline rendering mode (fallback) -->
<div class="pdf-preview-container inline" *ngIf="!isDialogMode && pdfSafeUrl">
  <iframe [src]="pdfSafeUrl" class="pdf-iframe" title="PDF Quotation Preview"></iframe>
</div>
